name: Refresh data

on:
  schedule:
    - cron: "30 6 * * *"   # every day 06:30 UTC; RKI and ECDC publish weekly, mostly Wed-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Download open data and rebuild tables
        run: python -m fluwatch.build --download
      - name: Tests
        run: python -m pytest -q tests
      - name: Commit only if the data changed
        run: |
          if git diff --quiet -- data/processed/*.parquet; then
            echo "No new data"; git checkout -- data/processed/meta.json; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "Data refresh $(date -u +%F)"
          git push
